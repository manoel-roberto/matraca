# nixpacks.toml — build do Matraca (Nixpacks)
#
# Host: Oracle ARM64 Neoverse-N1 (Ampere Altra, ARMv8.2-A, SEM SVE).
#
# NOTA DE DEPLOY (importante):
# O PyMuPDF precisa de `libstdc++.so.6`, mas o Python do Nix usa um loader
# separado que NÃO indexa a libstdc++ do Ubuntu (/usr/lib/aarch64-linux-gnu).
# O `LD_LIBRARY_PATH` precisa apontar para a libstdc++ do pacote Nix `gcc`
# (/nix/store/<hash>-gcc-13.3.0-lib/lib), senão dá
# "libstdc++.so.6: cannot open shared object file" (ou "Illegal instruction"
# se apontar para a lib do Ubuntu).
#
# O `nixLibs` do Nixpacks grava o path em /etc/profile.d, que NÃO é carregado
# pelo entrypoint (mesma limitação do PATH=/opt/venv/bin). Portanto o
# LD_LIBRARY_PATH é setado no ENV do container no Dokploy (não aqui).
# Se o nixpkgs mudar numa atualização do Nixpacks, atualizar o <hash> no env.

[phases.setup]
aptPkgs = ["ffmpeg", "libstdc++6"]
